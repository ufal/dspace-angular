<div class="clamp-{{background}}-{{lines}} min-{{minLines}} {{type}} {{fixedHeight ? 'fixedHeight' : ''}} {{noIdExpandable ? 'position-relative' : ''}}">
  <div #content class="flex row content dont-break-out preserve-line-breaks">
    <ng-content></ng-content>
  </div>
  <button *ngIf="!noIdExpandable" class="btn btn-link p-0 expandButton" dsDragClick (actualClick)="toggle()">
    <i class="fas fa-angle-down"></i>
    <span class="ml-1">{{ 'item.truncatable-part.show-more' | translate }}</span>
  </button>
  <button class="btn btn-link p-0 collapseButton" dsDragClick (actualClick)="toggle()" *ngIf="expand && expandable && !noIdExpandable">
    <i class="fas fa-angle-up"></i>
    <span class="ml-1">{{ 'item.truncatable-part.show-less' | translate }}</span>
  </button>
   <i  *ngIf="noIdExpandable && !expandable" (click)="toggleWithoutId($event, true)" style="position: absolute; right: 0; bottom: 0;"  class="fa fa-angle-down expandIcon" aria-hidden="true"></i>
   <i  *ngIf="noIdExpandable && expandable" (click)="toggleWithoutId($event, false)" style="position: absolute; right: 0; bottom: 0;"  class="fa fa-angle-up collapseIcon" aria-hidden="true"></i>

</div>
